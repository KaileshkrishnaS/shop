<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SK Product Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface2: #1f1f1f; --border: #2a2a2a;
    --gold: #c9a84c; --text: #f0ede8; --text-muted: #888;
    --success: #52b788; --danger: #e05252;
    --safe-area-bottom: env(safe-area-inset-bottom);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
  .page { display: none; flex-direction: column; height: 100vh; width: 100%; position: absolute; inset: 0; background: var(--bg); animation: slideIn 0.2s ease-out; }
  .page.active { display: flex; }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  
  header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .back-btn { background: none; border: none; color: var(--gold); font-size: 1.2rem; cursor: pointer; }
  
  .content { flex: 1; overflow-y: auto; padding: 1.5rem; padding-bottom: 80px; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; }
  .field input, .field select { width: 100%; background: var(--surface2); border: 1px solid var(--border); padding: 1rem; border-radius: 12px; color: #fff; font-size: 1rem; outline: none; }
  
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-align: center; padding-bottom: 12px; }
  .card img { width: 100%; height: 150px; object-fit: contain; padding: 5px; cursor: pointer; }
  .card h4 { font-size: 0.9rem; margin-top: 6px; padding: 0 4px; }
  .price-row { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .mrp { text-decoration: line-through; color: var(--text-muted); font-size: 0.7rem; }
  .discount-badge { background: var(--danger); color: #fff; font-size: 0.6rem; padding: 2px 4px; border-radius: 4px; font-weight: bold; }
  .actual-price { color: var(--gold); font-weight: 700; font-size: 1rem; margin-top: 2px; }
  .add-btn { width: 90%; background: var(--gold); color: #000; border: none; padding: 6px; border-radius: 8px; margin-top: 8px; font-weight: 700; cursor: pointer; font-size: 0.8rem; }
  .confirm-btn { width: 90%; background: var(--success); color: #fff; border: none; padding: 6px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 6px; font-size: 0.8rem; margin-left:auto; margin-right:auto; display:block; transition: 0.2s; }
  
  .bottom-action { position: fixed; bottom: 0; left: 0; right: 0; padding: 1.2rem; background: linear-gradient(transparent, var(--bg) 20%); padding-bottom: calc(1.2rem + var(--safe-area-bottom)); }
  .btn-main { width: 100%; background: var(--gold); color: #000; border: none; padding: 1.2rem; border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; position: relative; }
  .btn-main:disabled { opacity: 0.7; cursor: wait; }

  @keyframes spinDots {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }
  .btn-main.loading {
    color: transparent !important; 
  }
  .btn-main.loading::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 24px;
    height: 24px;
    border: 4px dotted #000;
    border-radius: 50%;
    animation: spinDots 2s linear infinite;
  }
  
  .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; justify-content: flex-end; flex-direction: column; }
  .cart-overlay.open { display: flex; }
  .cart-sheet { background: var(--surface); border-radius: 24px 24px 0 0; max-height: 85vh; display: flex; flex-direction: column; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center; }
  .modal-overlay.hidden { display: none; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 0.8rem 1.5rem; border-radius: 50px; font-weight: 600; opacity: 0; transition: 0.3s; z-index: 3000; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="page active" id="page-login">
  <header><div style="font-weight:700; color:var(--gold)">SK Product</div></header>
  <div class="content">
    <h2 style="margin-bottom:1.5rem">Welcome</h2>
    <div class="field"><label>Name</label><input type="text" id="f-name" placeholder="Full Name"></div>
    <div class="field"><label>Phone</label><input type="tel" id="f-phone" placeholder="Phone Number"></div>
    <div class="field"><label>Address</label><input type="text" id="f-address" placeholder="Delivery Address"></div>
  </div>
  <div class="bottom-action">
    <button class="btn-main" id="login-btn" onclick="handleLogin()">Get Started →</button>
  </div>
</div>

<div class="page" id="page-products">
  <header>
    <button class="back-btn" onclick="showPage('page-login')">←</button>
    <div style="font-weight:700; display:flex; align-items:center; gap:8px;">
      <input type="text" id="search-bar" placeholder="Search items..." onkeyup="filterProducts()" style="padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--surface2); color:#fff; width:150px; font-size:0.85rem; outline:none;">
    </div>
    <div onclick="openCart()" style="position:relative; cursor:pointer; font-size:1.3rem;">🛒<span id="cart-badge" style="position:absolute; top:-5px; right:-10px; background:var(--gold); color:#000; font-size:10px; padding:2px 5px; border-radius:10px; font-weight:bold;">0</span></div>
  </header>
  <div class="content"><div class="grid" id="product-grid"></div></div>
</div>

<div class="page" id="page-success">
  <div class="content" style="text-align:center; padding-top:30%">
    <div style="font-size:4rem">🎉</div>
    <h3 id="success-greeting" style="color:var(--gold); margin-bottom: 0.5rem; font-size:1.5rem;"></h3>
    <h2>Order Placed!</h2>
    <p style="color:var(--text-muted); margin-top:1rem">Your items are on the way.</p>
    <p style="color:var(--text-muted); font-size:0.85rem; margin-top:2rem;">For queries call: <strong style="color:var(--text);">90XXXXXXXX</strong></p>
    <div class="bottom-action"><button class="btn-main" onclick="location.reload()">Shop Again</button></div>
  </div>
</div>

<div class="cart-overlay" id="cart-overlay" onclick="if(event.target===this)closeCart()">
  <div class="cart-sheet">
    <div style="padding:1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">Your Cart</h3>
      <button onclick="closeCart()" style="background:none; border:none; color:#fff; cursor:pointer;">Close</button>
    </div>
    <div id="cart-list" style="overflow-y:auto; padding:1rem; flex:1"></div>
    <div style="padding:1.5rem; border-top:1px solid var(--border)">
      <div style="margin-bottom: 1.2rem;">
         <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.4rem; font-weight:bold;">Delivery Slot</label>
         <select id="delivery-slot" style="width:100%; padding:0.8rem; border-radius:10px; background:var(--surface2); border:1px solid var(--border); color:#fff; outline:none; font-family:'DM Sans', sans-serif;">
             <option value="Morning (9 AM - 12 PM)">Morning (9 AM - 12 PM)</option>
             <option value="Evening (4 PM - 8 PM)">Evening (4 PM - 8 PM)</option>
         </select>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:1rem">
        <span>Total Saved: <span id="cart-savings" style="color:var(--success); font-weight:700">₹0</span></span>
        <span>Total: <span id="cart-total" style="color:var(--gold); font-weight:700">₹0</span></span>
      </div>
      <button class="btn-main" id="checkout-btn" onclick="handleCheckout()">Confirm Order</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="returning-modal">
    <div style="background:var(--surface); padding:2rem; border-radius:20px; text-align:center; border:1px solid var(--border); width:80%;">
        <h3>Last Order</h3>
        <p style="margin:1rem 0; color:var(--text-muted)">We found an existing cart in our records. Restore it?</p>
        <div style="display:flex; gap:10px;">
            <button onclick="startNewCart()" style="flex:1; background:none; border:1px solid var(--border); color:white; padding:10px; border-radius:10px; cursor:pointer;">New</button>
            <button onclick="restoreCart()" style="flex:1; background:var(--gold); border:none; color:black; font-weight:bold; padding:10px; border-radius:10px; cursor:pointer;">Restore</button>
        </div>
    </div>
</div>

<div class="modal-overlay hidden" id="product-modal" onclick="if(event.target===this)closeProductModal()">
    <div style="background:var(--surface); border-radius:20px; text-align:center; border:1px solid var(--border); width:90%; max-width:400px; overflow:hidden; position:relative;">
        <button onclick="closeProductModal()" style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.6); color:white; border:none; border-radius:50%; width:30px; height:30px; font-size:1.2rem; cursor:pointer; z-index:10;">&times;</button>
        <img id="modal-img" src="" style="width:100%; height:250px; object-fit:contain; background:#fff; padding:10px;" onerror="this.style.display='none'">
        <div style="padding:1.5rem;">
            <h2 id="modal-title" style="margin-bottom:5px;">Product Name</h2>
            <div class="price-row" style="margin-bottom:10px; font-size:1rem;">
                <span class="mrp" id="modal-mrp">₹0</span>
                <span class="discount-badge" id="modal-discount">0% OFF</span>
            </div>
            <div class="actual-price" id="modal-price" style="font-size:1.8rem; margin-bottom:20px;">₹0</div>
            <div id="modal-action-container"></div>
        </div>
    </div>
</div>

<script>
// IMPORTANT: Paste your Apps Script URL here!
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxd-VY1Ji4wp68Bo5v6S8RdRUQIukc0ziDM2F86y2FepriByhftQhxNUIGeJxGLhNIH/exec';

let PRODUCTS = [];
let user = {};
let cart = [];
let savedData = null;

document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById('login-btn');
    if(btn) {
        btn.disabled = true;
        btn.classList.add('loading');
    }

    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: 'getProducts' })
    })
    .then(res => res.json())
    .then(data => {
        if(data.success && data.products) {
            PRODUCTS = data.products;
        } else if (data.error) {
            alert("Sheet Error: " + data.error); 
        }
        checkLocalCache();
    })
    .catch(err => {
        console.error("Failed to fetch products:", err);
        alert("Cannot connect to Database. Please check your App Script Deployment.");
        checkLocalCache();
    })
    .finally(() => {
        if(btn) {
            btn.disabled = false;
            btn.classList.remove('loading'); 
        }
    });
});

function checkLocalCache() {
    const cachedUser = localStorage.getItem('shopease_user');
    const cachedCart = localStorage.getItem('shopease_cart');
    
    if (cachedUser) {
        user = JSON.parse(cachedUser);
        document.getElementById('f-name').value = user.name;
        document.getElementById('f-phone').value = user.phone;
        document.getElementById('f-address').value = user.address;
        
        let hasActiveCart = false;
        try {
            if (cachedCart) {
                const parsedCart = JSON.parse(cachedCart);
                if (parsedCart.length > 0) {
                    hasActiveCart = true;
                    cart = parsedCart; 
                    updateUI(); 
                    proceedToShop();
                }
            }
        } catch(e) {}

        if (!hasActiveCart) {
            const btn = document.getElementById('login-btn');
            if(btn) { 
                btn.disabled = true; 
                btn.classList.add('loading'); 
            }

            fetch(APPS_SCRIPT_URL, { 
                method: 'POST',
                redirect: 'follow',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: 'checkUser', ...user }) 
            })
            .then(res => res.json())
            .then(data => {
                if(data.found && data.cart && data.cart.length > 0) {
                    savedData = data.cart;
                    document.getElementById('returning-modal').classList.remove('hidden');
                } else { 
                    proceedToShop(); 
                }
            })
            .catch(() => proceedToShop())
            .finally(() => {
                if(btn) { 
                    btn.disabled = false; 
                    btn.classList.remove('loading'); 
                }
            });
        }
    }
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function handleLogin() {
  user = {
    name: document.getElementById('f-name').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    address: document.getElementById('f-address').value.trim()
  };
  
  if(!user.name || !user.phone) return showToast('Enter Name & Phone');

  localStorage.setItem('shopease_user', JSON.stringify(user));

  const btn = document.getElementById('login-btn');
  btn.disabled = true; 
  btn.classList.add('loading');
  
  fetch(APPS_SCRIPT_URL, { 
    method: 'POST',
    redirect: 'follow',
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: 'checkUser', ...user }) 
  })
  .then(res => res.json())
  .then(data => {
    if(data.found && data.cart && data.cart.length > 0) {
        savedData = data.cart;
        document.getElementById('returning-modal').classList.remove('hidden');
    } else { proceedToShop(); }
  })
  .catch(() => proceedToShop())
  .finally(() => { 
      btn.disabled = false; 
      btn.classList.remove('loading'); 
  });
}

function proceedToShop() {
  document.getElementById('returning-modal').classList.add('hidden');
  renderProducts(); 
  showPage('page-products');
}

function restoreCart() {
  try { cart = typeof savedData === 'string' ? JSON.parse(savedData) : savedData; } 
  catch(e) { cart = []; }
  updateUI(); proceedToShop(); showToast('Cart Restored!');
}

function startNewCart() { cart = []; updateUI(); proceedToShop(); }

function filterProducts() {
  const searchTerm = document.getElementById('search-bar').value.toLowerCase();
  renderProducts(searchTerm);
}

function openProductModal(name) {
    const p = PRODUCTS.find(prod => prod.name === name);
    if(!p) return;

    document.getElementById('modal-img').src = p.productImg || '';
    document.getElementById('modal-img').style.display = p.productImg ? 'block' : 'none';
    document.getElementById('modal-title').innerText = p.name;
    document.getElementById('modal-mrp').innerText = `₹${p.mrp}`;
    document.getElementById('modal-discount').innerText = `${p.discount}% OFF`;
    document.getElementById('modal-price').innerText = `₹${p.price}`;

    updateModalCartAction(p.name);
    document.getElementById('product-modal').classList.remove('hidden');
}

function closeProductModal() {
    document.getElementById('product-modal').classList.add('hidden');
}

// NEW: Function to lock in the item quantity and hide the Confirm button
function confirmItem(name) {
    const item = cart.find(c => c.name === name);
    if (item) {
        item.confirmed = true;
        updateUI(); 
        showToast('✓ Confirmed');
        
        // Also update the modal if it happens to be open
        const modalTitle = document.getElementById('modal-title').innerText;
        if (!document.getElementById('product-modal').classList.contains('hidden') && modalTitle === name) {
            updateModalCartAction(name);
        }
    }
}

function updateModalCartAction(name) {
    const p = PRODUCTS.find(prod => prod.name === name);
    const cartItem = cart.find(c => c.name === name);
    let btnHtml = '';
    
    if(cartItem) {
        let confirmBtnHtml = cartItem.confirmed ? '' : `<button class="confirm-btn" onclick="confirmItem('${p.name.replace(/'/g, "\\'")}')" style="margin-top:10px; width:100%; font-size:1rem; padding:10px;">✓ Confirm</button>`;
        btnHtml = `
        <div style="display:flex; flex-direction:column; width:100%;">
            <div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface2); padding:8px; border-radius:10px; border:1px solid var(--gold); width:100%;">
                <button onclick="changeCartQty('${p.name.replace(/'/g, "\\'")}', -1); updateModalCartAction('${p.name.replace(/'/g, "\\'")}');" style="background:none; color:white; border:none; width:40px; height:40px; font-size:1.5rem; cursor:pointer;">-</button>
                <span style="font-weight:700; color:var(--gold); font-size:1.3rem;">${cartItem.qty}</span>
                <button onclick="changeCartQty('${p.name.replace(/'/g, "\\'")}', 1); updateModalCartAction('${p.name.replace(/'/g, "\\'")}');" style="background:var(--gold); color:black; border:none; width:40px; height:40px; border-radius:8px; font-weight:bold; font-size:1.5rem; cursor:pointer;">+</button>
            </div>
            ${confirmBtnHtml}
        </div>`;
    } else {
        btnHtml = `<button class="btn-main" onclick="addToCart('${p.name.replace(/'/g, "\\'")}'); updateModalCartAction('${p.name.replace(/'/g, "\\'")}');" style="padding:1rem;">Add to Cart</button>`;
    }
    
    document.getElementById('modal-action-container').innerHTML = btnHtml;
}

function renderProducts(filterTerm = "") {
  if (PRODUCTS.length === 0) {
      document.getElementById('product-grid').innerHTML = `<p style="color:var(--text-muted); text-align:center; grid-column: 1 / -1;">No products found.</p>`;
      return;
  }
  
  const itemsToDisplay = PRODUCTS.filter(p => p.name.toLowerCase().includes(filterTerm));

  if (itemsToDisplay.length === 0) {
      document.getElementById('product-grid').innerHTML = `<p style="color:var(--text-muted); text-align:center; grid-column: 1 / -1; margin-top: 2rem;">No items match "${filterTerm}"</p>`;
      return;
  }
  
  document.getElementById('product-grid').innerHTML = itemsToDisplay.map(p => {
    const cartItem = cart.find(c => c.name === p.name);
    let btn = '';

    if (cartItem) {
        let confirmBtnHtml = cartItem.confirmed ? '' : `<button class="confirm-btn" onclick="confirmItem('${p.name.replace(/'/g, "\\'")}')">✓ Confirm</button>`;
        btn = `
        <div style="display:flex; flex-direction:column; width:100%; margin:8px auto 0;">
            <div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface2); padding:2px; border-radius:6px; border:1px solid var(--gold); width:90%; margin:0 auto;">
                <button onclick="changeCartQty('${p.name.replace(/'/g, "\\'")}', -1)" style="background:none; color:white; border:none; width:25px; height:25px; font-size:1rem;">-</button>
                <span style="font-weight:700; color:var(--gold); font-size:0.9rem;">${cartItem.qty}</span>
                <button onclick="changeCartQty('${p.name.replace(/'/g, "\\'")}', 1)" style="background:var(--gold); color:black; border:none; width:25px; height:25px; border-radius:4px; font-weight:bold;">+</button>
            </div>
            ${confirmBtnHtml}
        </div>`;
    } else {
        btn = `<button class="add-btn" onclick="addToCart('${p.name.replace(/'/g, "\\'")}')">+ Add</button>`;
    }

    return `<div class="card"><img src="${p.productImg || ''}" onerror="this.style.display='none'" onclick="openProductModal('${p.name.replace(/'/g, "\\'")}')"><h4>${p.name}</h4><div class="price-row"><span class="mrp">₹${p.mrp}</span><span class="discount-badge">${p.discount}% OFF</span></div><div class="actual-price">₹${p.price}</div>${btn}</div>`;
  }).join('');
}

function addToCart(name) {
  const p = PRODUCTS.find(prod => prod.name === name);
  const exist = cart.find(c => c.name === name);
  if(exist) {
      exist.qty++;
      exist.confirmed = false; // Show confirm button again
  } else { 
      cart.push({ ...p, qty: 1, confirmed: false });
  }
  updateUI(); showToast('Added to Cart');
}

function changeCartQty(name, delta) {
  const item = cart.find(c => c.name === name);
  if (item) {
    item.qty += delta;
    item.confirmed = false; // Quantity changed, show confirm button again
    if (item.qty <= 0) cart = cart.filter(c => c.name !== name);
    updateUI();
  }
}

function updateUI() {
  const count = cart.reduce((s, i) => s + i.qty, 0);
  const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
  const totalMrp = cart.reduce((s, i) => s + (i.mrp * i.qty), 0);
  
  document.getElementById('cart-badge').innerText = count;
  document.getElementById('cart-total').innerText = `₹${total}`;
  document.getElementById('cart-savings').innerText = `₹${totalMrp - total}`;
  
  localStorage.setItem('shopease_cart', JSON.stringify(cart));
  
  if(document.getElementById('page-products').classList.contains('active')) {
      filterProducts(); 
  }
  
  document.getElementById('cart-list').innerHTML = cart.length === 0 ? `<div style="text-align:center; padding:2rem; color:var(--text-muted);">Cart is empty.</div>` : cart.map(i => `<div style="margin-bottom:12px; padding:12px; background:var(--surface2); border-radius:12px; border:1px solid var(--border);"><div style="display:flex; justify-content:space-between;"><div><b>${i.name}</b><br><small>₹${i.price} each</small></div><b style="color:var(--gold)">₹${i.price*i.qty}</b></div><div style="display:flex; justify-content:space-between; margin-top:10px;"><div style="background:var(--bg); padding:4px; border-radius:8px;"><button onclick="changeCartQty('${i.name.replace(/'/g, "\\'")}', -1)">-</button> <span style="margin:0 10px">${i.qty}</span> <button onclick="changeCartQty('${i.name.replace(/'/g, "\\'")}', 1)">+</button></div><button onclick="cart=cart.filter(c=>c.name!=='${i.name.replace(/'/g, "\\'")}'); updateUI();" style="color:var(--danger); background:none; border:none;">Remove</button></div></div>`).join('');
}

function handleCheckout() {
    if(cart.length === 0) return;
    
    const selectedSlot = document.getElementById('delivery-slot').value;
    
    localStorage.removeItem('shopease_cart'); 
    
    document.getElementById('success-greeting').innerText = `Thank you, ${user.name || 'Customer'}!`;
    
    showPage('page-success'); 
    closeCart();
    
    fetch(APPS_SCRIPT_URL, { 
        method: 'POST',
        redirect: 'follow',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: 'saveOrder', ...user, cart: JSON.stringify(cart), slot: selectedSlot }) 
    });
    
    cart = []; updateUI();
}

function openCart() { document.getElementById('cart-overlay').classList.add('open'); }
function closeCart() { document.getElementById('cart-overlay').classList.remove('open'); }
function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }
</script>
</body>
</html>
