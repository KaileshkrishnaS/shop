<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SK Products Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface2: #1f1f1f; --border: #2a2a2a;
    --gold: #c9a84c; --text: #f0ede8; --text-muted: #888;
    --success: #52b788; --danger: #e05252;
    --safe-area-bottom: env(safe-area-inset-bottom);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
  .page { display: none; flex-direction: column; height: 100vh; width: 100%; position: absolute; inset: 0; background: var(--bg); animation: slideIn 0.2s ease-out; }
  .page.active { display: flex; }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.2rem; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .back-btn { background: none; border: none; color: var(--gold); font-size: 1.2rem; cursor: pointer; }
  .content { flex: 1; overflow-y: auto; padding: 1.5rem; padding-bottom: 80px; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; }
  .field input { width: 100%; background: var(--surface2); border: 1px solid var(--border); padding: 1rem; border-radius: 12px; color: #fff; font-size: 1rem; outline: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; text-align: center; padding-bottom: 12px; }
  .card img { width: 100%; height: 120px; object-fit: cover; }
  .price-row { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 4px; }
  .mrp { text-decoration: line-through; color: var(--text-muted); font-size: 0.8rem; }
  .discount-badge { background: var(--danger); color: #fff; font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
  .actual-price { color: var(--gold); font-weight: 700; font-size: 1.15rem; margin-top: 2px; }
  .add-btn { width: 90%; background: var(--gold); color: #000; border: none; padding: 8px; border-radius: 8px; margin-top: 10px; font-weight: 700; cursor: pointer; }
  .confirm-btn { width: 100%; background: var(--success); color: #fff; border: none; padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .bottom-action { position: fixed; bottom: 0; left: 0; right: 0; padding: 1.2rem; background: linear-gradient(transparent, var(--bg) 20%); padding-bottom: calc(1.2rem + var(--safe-area-bottom)); }
  .btn-main { width: 100%; background: var(--gold); color: #000; border: none; padding: 1.2rem; border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; }
  .btn-main:disabled { opacity: 0.5; }
  .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; justify-content: flex-end; flex-direction: column; }
  .cart-overlay.open { display: flex; }
  .cart-sheet { background: var(--surface); border-radius: 24px 24px 0 0; max-height: 85vh; display: flex; flex-direction: column; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center; }
  .modal-overlay.hidden { display: none; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 0.8rem 1.5rem; border-radius: 50px; font-weight: 600; opacity: 0; transition: 0.3s; z-index: 3000; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="page active" id="page-login">
  <header><div style="font-weight:700; color:var(--gold)">SK Product</div></header>
  <div class="content">
    <h2 style="margin-bottom:1.5rem">Welcome</h2>
    <div class="field"><label>Name</label><input type="text" id="f-name" placeholder="Full Name"></div>
    <div class="field"><label>Phone</label><input type="tel" id="f-phone" placeholder="Phone Number"></div>
    <div class="field"><label>Address</label><input type="text" id="f-address" placeholder="Delivery Address"></div>
  </div>
  <div class="bottom-action">
    <button class="btn-main" id="login-btn" onclick="handleLogin()">Get Started →</button>
  </div>
</div>

<div class="page" id="page-domains">
  <header>
    <button class="back-btn" onclick="showPage('page-login')">←</button>
    <div style="font-weight:700">Categories</div>
    <div onclick="openCart()" style="position:relative; cursor:pointer;">🛒<span id="cart-badge" style="position:absolute; top:-5px; right:-10px; background:var(--gold); color:#000; font-size:10px; padding:2px 5px; border-radius:10px;">0</span></div>
  </header>
  <div class="content"><div class="grid" id="domain-grid"></div></div>
</div>

<div class="page" id="page-products">
  <header>
    <button class="back-btn" onclick="showPage('page-domains')">← Back</button>
    <div id="domain-title" style="font-weight:700">Products</div>
    <div onclick="openCart()" style="cursor:pointer;">🛒</div>
  </header>
  <div class="content"><div class="grid" id="product-grid"></div></div>
</div>

<div class="page" id="page-success">
  <div class="content" style="text-align:center; padding-top:30%">
    <div style="font-size:4rem">🎉</div>
    <h2>Order Placed!</h2>
    <p style="color:var(--text-muted); margin-top:1rem">Your items are on the way.</p>
    <div class="bottom-action"><button class="btn-main" onclick="location.reload()">Shop Again</button></div>
  </div>
</div>

<div class="cart-overlay" id="cart-overlay" onclick="if(event.target===this)closeCart()">
  <div class="cart-sheet">
    <div style="padding:1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">Your Cart</h3>
      <button onclick="closeCart()" style="background:none; border:none; color:#fff; cursor:pointer;">Close</button>
    </div>
    <div id="cart-list" style="overflow-y:auto; padding:1rem; flex:1"></div>
    <div style="padding:1.5rem; border-top:1px solid var(--border)">
      <div style="display:flex; justify-content:space-between; margin-bottom:1rem">
        <span>Total Saved: <span id="cart-savings" style="color:var(--success); font-weight:700">₹0</span></span>
        <span>Total: <span id="cart-total" style="color:var(--gold); font-weight:700">₹0</span></span>
      </div>
      <button class="btn-main" id="checkout-btn" onclick="handleCheckout()">Confirm Order</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="returning-modal">
    <div style="background:var(--surface); padding:2rem; border-radius:20px; text-align:center; border:1px solid var(--border); width:80%;">
        <h3>Last Order</h3>
        <p style="margin:1rem 0; color:var(--text-muted)">We found an existing cart in our records. Restore it?</p>
        <div style="display:flex; gap:10px;">
            <button onclick="startNewCart()" style="flex:1; background:none; border:1px solid var(--border); color:white; padding:10px; border-radius:10px; cursor:pointer;">New</button>
            <button onclick="restoreCart()" style="flex:1; background:var(--gold); border:none; color:black; font-weight:bold; padding:10px; border-radius:10px; cursor:pointer;">Restore</button>
        </div>
    </div>
</div>

<script>
// REPLACE WITH YOUR APPS SCRIPT URL
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxd-VY1Ji4wp68Bo5v6S8RdRUQIukc0ziDM2F86y2FepriByhftQhxNUIGeJxGLhNIH/exec';

const PRODUCTS = [
  { name: 'Apple', domain: 'FRUIT', domainImg: 'https://drive.google.com/thumbnail?id=1pB8Nm_tUuudKM199nbPlEUXGWxFZwHKc', productImg: 'https://drive.google.com/thumbnail?id=1hzhF3NVi_UFF1VTvFdGhnWTrf5Qs0tzO', mrp: 250, discount: 10, price: 225 },
  { name: 'Biriyani', domain: 'FOOD', domainImg: 'https://drive.google.com/thumbnail?id=1osonm1IB-o5ieotukNbBdRT63hUFL7Ob', productImg: 'https://drive.google.com/thumbnail?id=1TT89jxxWrc70WCVWbPll1PINP0FPmueR', mrp: 200, discount: 10, price: 180 },
  { name: 'Shirt', domain: 'DRESS', domainImg: 'https://drive.google.com/thumbnail?id=1TNsb3CH6HaFPELzN0rv1c0_QlbcoLoO2', productImg: 'https://drive.google.com/thumbnail?id=1OdoCKA_TRt26YACu0v3tb9qhArPJ4kDF', mrp: 800, discount: 10, price: 720 },
  { name: 'Mango Juice', domain: 'JUICE', domainImg: 'https://drive.google.com/thumbnail?id=1CaQ4yv6HAAJUi-0ZNHuCfZhVRdkBTegZ', productImg: 'https://drive.google.com/thumbnail?id=1ldf4FEIRu-N3sb194H2DxBUGeaHAqUIO', mrp: 60, discount: 10, price: 54 },
];

let user = {};
let cart = [];
let savedData = null;
let currentDomain = ''; 

// --- NEW: AUTO-LOGIN LOGIC ---
document.addEventListener("DOMContentLoaded", () => {
    const cachedUser = localStorage.getItem('shopease_user');
    const cachedCart = localStorage.getItem('shopease_cart');
    
    if (cachedUser) {
        user = JSON.parse(cachedUser);
        document.getElementById('f-name').value = user.name;
        document.getElementById('f-phone').value = user.phone;
        document.getElementById('f-address').value = user.address;
        
        if (cachedCart) { cart = JSON.parse(cachedCart); updateUI(); }
        
        // Skip login screen entirely for returning users (0.1 second!)
        proceedToShop();
    }
});

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function handleLogin() {
  user = {
    name: document.getElementById('f-name').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    address: document.getElementById('f-address').value.trim()
  };
  
  if(!user.name || !user.phone) return showToast('Enter Name & Phone');

  // Save to phone memory immediately
  localStorage.setItem('shopease_user', JSON.stringify(user));

  const btn = document.getElementById('login-btn');
  btn.innerText = 'Please Wait....';
  btn.disabled = true; 
  
  fetch(APPS_SCRIPT_URL, { 
    method: 'POST', body: JSON.stringify({ action: 'checkUser', ...user }) 
  })
  .then(res => res.json())
  .then(data => {
    if(data.found && data.cart && data.cart.length > 0) {
        savedData = data.cart;
        document.getElementById('returning-modal').classList.remove('hidden');
    } else { proceedToShop(); }
  })
  .catch(() => proceedToShop())
  .finally(() => { btn.innerText = 'Get Started →'; btn.disabled = false; });
}

function proceedToShop() {
  document.getElementById('returning-modal').classList.add('hidden');
  renderDomains(); showPage('page-domains');
}

function restoreCart() {
  try { cart = typeof savedData === 'string' ? JSON.parse(savedData) : savedData; } 
  catch(e) { cart = []; }
  updateUI(); proceedToShop(); showToast('Cart Restored!');
}

function startNewCart() { cart = []; updateUI(); proceedToShop(); }

function renderDomains() {
  const domains = [...new Set(PRODUCTS.map(p => p.domain))];
  document.getElementById('domain-grid').innerHTML = domains.map(d => `
    <div class="card" onclick="showDomain('${d}')" style="cursor:pointer;">
      <img src="${PRODUCTS.find(p=>p.domain===d).domainImg}">
      <h4 style="margin-top:8px">${d}</h4>
    </div>
  `).join('');
}

function showDomain(d) {
  currentDomain = d;
  document.getElementById('domain-title').innerText = d;
  renderProducts(); 
  showPage('page-products');
}

function renderProducts() {
  if (!currentDomain) return;
  const items = PRODUCTS.filter(p => p.domain === currentDomain);
  document.getElementById('product-grid').innerHTML = items.map(p => {
    const cartItem = cart.find(c => c.name === p.name);
    let btn = cartItem ? `
        <div style="display:flex; flex-direction:column; width:90%; margin:10px auto 0;">
            <div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface2); padding:4px; border-radius:8px; border:1px solid var(--gold);">
                <button onclick="changeCartQty('${p.name}', -1)" style="background:none; color:white; border:none; width:30px; height:30px; font-size:1.2rem;">-</button>
                <span style="font-weight:700; color:var(--gold);">${cartItem.qty}</span>
                <button onclick="changeCartQty('${p.name}', 1)" style="background:var(--gold); color:black; border:none; width:30px; height:30px; border-radius:6px; font-weight:bold;">+</button>
            </div>
            <button class="confirm-btn" onclick="showToast('✓ Confirmed')">✓ Confirm</button>
        </div>` : `<button class="add-btn" onclick="addToCart('${p.name}')">+ Add</button>`;

    return `<div class="card"><img src="${p.productImg}"><h4>${p.name}</h4><div class="price-row"><span class="mrp">₹${p.mrp}</span><span class="discount-badge">${p.discount}% OFF</span></div><div class="actual-price">₹${p.price}</div>${btn}</div>`;
  }).join('');
}

function addToCart(name) {
  const p = PRODUCTS.find(prod => prod.name === name);
  const exist = cart.find(c => c.name === name);
  if(exist) exist.qty++; else cart.push({ ...p, qty: 1 });
  updateUI(); showToast('Added to Cart');
}

function changeCartQty(name, delta) {
  const item = cart.find(c => c.name === name);
  if (item) {
    item.qty += delta;
    if (item.qty <= 0) cart = cart.filter(c => c.name !== name);
    updateUI();
  }
}

function updateUI() {
  const count = cart.reduce((s, i) => s + i.qty, 0);
  const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
  const totalMrp = cart.reduce((s, i) => s + (i.mrp * i.qty), 0);
  
  document.getElementById('cart-badge').innerText = count;
  document.getElementById('cart-total').innerText = `₹${total}`;
  document.getElementById('cart-savings').innerText = `₹${totalMrp - total}`;
  
  // --- NEW: SAVE CART TO PHONE MEMORY ---
  localStorage.setItem('shopease_cart', JSON.stringify(cart));
  
  renderProducts();
  document.getElementById('cart-list').innerHTML = cart.length === 0 ? `<div style="text-align:center; padding:2rem; color:var(--text-muted);">Cart is empty.</div>` : cart.map(i => `<div style="margin-bottom:12px; padding:12px; background:var(--surface2); border-radius:12px; border:1px solid var(--border);"><div style="display:flex; justify-content:space-between;"><div><b>${i.name}</b><br><small>₹${i.price} each</small></div><b style="color:var(--gold)">₹${i.price*i.qty}</b></div><div style="display:flex; justify-content:space-between; margin-top:10px;"><div style="background:var(--bg); padding:4px; border-radius:8px;"><button onclick="changeCartQty('${i.name}', -1)">-</button> <span style="margin:0 10px">${i.qty}</span> <button onclick="changeCartQty('${i.name}', 1)">+</button></div><button onclick="cart=cart.filter(c=>c.name!=='${i.name}'); updateUI();" style="color:var(--danger); background:none; border:none;">Remove</button></div></div>`).join('');
}

function handleCheckout() {
    if(cart.length === 0) return;
    localStorage.removeItem('shopease_cart'); // Clear cart on success
    showPage('page-success'); closeCart();
    fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'saveOrder', ...user, cart: JSON.stringify(cart) }) });
    cart = []; updateUI();
}

function openCart() { document.getElementById('cart-overlay').classList.add('open'); }
function closeCart() { document.getElementById('cart-overlay').classList.remove('open'); }
function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }
</script>
</body>
</html>
